[URL]
Port=7777
IGWPort=7888

[/Script/InfiniteGameWorlds.S2sController]
; Experimental: raise IGW max net cull radius from the shipped 500m
; (25.0e8 cm^2) to 2000m (400.0e8 cm^2). This is a low-confidence
; attempt to delay distant vehicle proxy substitution; remove this
; section if it increases bandwidth/CPU or has no visible effect.
MaxNetCullDistanceSquared=400.0e8

[ConsoleVariables]
; Partition-31 Hardcore PvE Deep Desert resource bonus. This file is wired only
; into the second DD service through DUNE_USERENGINE_CONFIG_PATH, so DD#1 keeps
; its separate 1.0x harvest config.
;Bgd.ServerDisplayName="My Arrakis, My Dune"
;Bgd.ServerLoginPassword="Sandworm"

Dune.GlobalMiningOutputMultiplier=3.0
Dune.GlobalVehicleMiningOutputMultiplier=3.0
SecurityZones.PvpResourceMultiplier=1.0
; Native Landsraad mission specialization XP reward multiplier. Keep the
; database-side specialization XP trigger disabled so this is the only 3x path.
dw.LandsraadMissionRewardMultiplierSpecializationXP=3.0
dw.VehicleDurabilityDamageMultiplier=1.15
Sandstorm.Enabled=1
Sandstorm.Treasure.Enabled=1
sandworm.dune.Enabled=1
Vehicle.SandwormCollisionInteraction=false
Sandworm.SandwormDangerZonesEnabled=true
Vehicle.SandwormInvulnerabilitySecondsOnExit=900.0
Vehicle.SandwormInvulnerabilitySecondsOnServerRestart=7200.0

; Test: disable the dedicated vehicle long-distance proxy path on DD#2.
; Current binary registers Vehicle.LongDistanceProxiesRange at 200000 cm
; (2000m) and hard-gates proxy entries below 300m. With the existing
; MaxNetCullDistanceSquared=400.0e8 experiment above, this separates "real
; actor can replicate farther" from "client only sees the proxy actor".
Vehicle.LongDistanceProxiesEnabled=0
